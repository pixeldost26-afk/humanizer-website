# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: humanize-db
    databaseName: humanizeai
    user: humanize
    plan: free

services:
  - type: web
    name: humanize-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: humanize-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.17.0
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: demo
      # Set NEXTAUTH_URL and NEXT_PUBLIC_APP_URL to your Render web service URL (e.g., https://humanize-ai.onrender.com)
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Optional: Add your OpenAI API Key if you want live AI responses instead of demo mode
      # - key: OPENAI_API_KEY
      #   sync: false
