# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: humanize-db
    databaseName: humanizeai
    user: humanize
    plan: free

services:
  - type: web
    name: MANAHUMANIZE-AI
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: humanize-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.17.0
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: NEXTAUTH_TRUST_HOST
        value: "true"
      # Production Domain & Sitemap Configuration
      - key: SITE_URL
        value: https://manahumanize-ai.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://manahumanize-ai.onrender.com
      - key: NEXTAUTH_URL
        sync: false
      # Google OAuth 2.0 Credentials
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional: Stripe Payment Gateway
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional: Razorpay Payment Gateway
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

